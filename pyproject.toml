[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-spend-guard"
version = "0.1.0"
description = "Wrap any stdio MCP server in a hard spend cap, per-tool rate limits, a circuit breaker and a kill switch."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Waseem Nasir", email = "hello@skynetjoe.com" }]
keywords = ["mcp", "model-context-protocol", "claude-code", "rate-limiting", "cost-control", "proxy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Monitoring",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/skynetlabs/mcp-spend-guard"
Issues = "https://github.com/skynetlabs/mcp-spend-guard/issues"

[project.scripts]
mcp-spend-guard = "mcp_spend_guard.cli:main"

[tool.setuptools]
packages = ["mcp_spend_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
